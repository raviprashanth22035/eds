<title id="nfl-event-hub-unified-title">NFL Event Hub unified event platform</title>
<desc id="nfl-event-hub-unified-desc">Platform architecture of the NFL Event Hub: NFL OnePass and web channels reach the hub through the edge CDN; the hub on AEM Edge Delivery composes discover and attend capabilities over one event model with personalization across all blocks; a thin identity and API middleware handles NFL ID sessions and calls Leap for registration, QR and check-in, Adobe Real-Time CDP for profile data and Journey Optimizer and Campaign for notifications; ticketing hands off to Ticketmaster and On Location, and OneTrust supplies consent.</desc>
