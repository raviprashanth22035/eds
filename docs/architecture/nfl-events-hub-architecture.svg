    <rect x="52" y="427" width="36" height="36" rx="8" fill="#eff6ff"/><use href="#i-cal" x="59" y="434" width="22" height="22" color="#2563eb"/><text x="102" y="450">Event details</text>
    <rect x="52" y="487" width="36" height="36" rx="8" fill="#eff6ff"/><use href="#i-ticket" x="59" y="494" width="22" height="22" color="#2563eb"/><text x="102" y="510">Registration</text>
