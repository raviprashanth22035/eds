<title id="nfl-events-hub-layered-title">NFL Events Hub layered platform architecture</title>
<desc id="nfl-events-hub-layered-desc">Three-layer architecture of the NFL Events Hub: marketing, operations and developer teams publish into AEM Edge Delivery storage; the edge CDN serves cached pages to every fan and routes only signed-in calls to a stateless edge worker; the worker calls NFL ID, the OnePass event platform and notifications; paid tickets link out to Ticketmaster.</desc>
